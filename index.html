<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OAC Fire Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #00060E;
      --panel: rgba(16, 23, 32, 0.75);
      --panel-border: rgba(248, 113, 113, 0.3);
      --panel-glow: rgba(248, 113, 113, 0.08);
      --input-bg: rgba(22, 31, 44, 0.9);

      --accent: #f87171;
      --accent-bright: #fca5a5;
      --accent-glow: rgba(248, 113, 113, 0.35);
      --accent-dark: #dc2626;

      --orange: #fb923c;
      --orange-glow: rgba(251, 146, 60, 0.25);
      --green: #4ade80;
      --green-glow: rgba(74, 222, 128, 0.25);
      --red: #f87171;
      --red-glow: rgba(248, 113, 113, 0.25);

      --text: #e2e8f0;
      --text-muted: #64748b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      padding-bottom: 60px;
      overflow-x: hidden;
      position: relative;
    }

    #bg-video {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60vw;
      height: 60vh;
      object-fit: contain;
      pointer-events: none;
      z-index: 0;
      opacity: 0.7;
      filter: brightness(1.1);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    #bg-video.hidden {
      opacity: 0;
      transform: translate(-50%, -55%) scale(0.95);
    }

    .top-header {
      position: relative;
      z-index: 10;
      width: 100%;
      background: rgba(15, 21, 29, 0.85);
      border-bottom: 1px solid var(--panel-border);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(20px);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
      margin-bottom: 32px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .top-header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff;
      text-shadow: 0 0 15px var(--accent-glow);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .top-header h1::before {
      content: "◈";
      color: var(--accent);
      font-size: 22px;
      text-shadow: 0 0 12px var(--accent);
    }

    .btn-panorama {
      background: rgba(248, 113, 113, 0.08);
      border: 1px solid var(--panel-border);
      color: var(--accent-bright);
      padding: 8px 14px;
      border-radius: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
      box-shadow: 0 0 10px var(--panel-glow);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
    }

    .btn-panorama:hover {
      background: rgba(248, 113, 113, 0.2);
      border-color: var(--accent);
      box-shadow: 0 0 18px var(--accent-glow);
      transform: translateY(-2px);
    }

    .btn-panorama:active {
      transform: translateY(0) scale(0.96);
    }

    .btn-panorama .pano-icon {
      font-size: 12px;
      display: inline-block;
      transition: transform 0.4s ease;
    }

    .btn-panorama:hover .pano-icon {
      transform: rotate(180deg);
    }

    .btn-panorama.off {
      border-color: rgba(100, 116, 139, 0.4);
      color: var(--text-muted);
      background: rgba(100, 116, 139, 0.1);
      box-shadow: none;
    }

    .btn-panorama.off:hover {
      border-color: var(--accent);
      color: var(--accent-bright);
      background: rgba(248, 113, 113, 0.15);
    }

    .container {
      position: relative;
      z-index: 10;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 24px;
      backdrop-filter: blur(18px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
      animation: cardSpawn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes cardSpawn {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card:hover {
      border-color: rgba(248, 113, 113, 0.6);
      box-shadow: 0 12px 35px var(--panel-glow);
    }

    .card-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    .field input {
      height: 44px;
      background: var(--input-bg);
      border: 1px solid rgba(248, 113, 113, 0.25);
      border-radius: 8px;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      outline: none;
      transition: all 0.25s ease;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 14px var(--accent-glow);
      background: rgba(38, 24, 28, 0.95);
      transform: translateY(-1px);
    }

    .btn {
      background: linear-gradient(135deg, var(--accent-dark), var(--accent));
      color: #0b0f14;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      padding: 12px 24px;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.5px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 15px var(--panel-glow);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 25px var(--accent-glow);
      background: linear-gradient(135deg, var(--accent), var(--accent-bright));
    }

    .btn-delete {
      background: rgba(248, 113, 113, 0.08);
      border: 1px solid rgba(248, 113, 113, 0.25);
      color: var(--red);
      width: 30px; height: 30px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }

    .btn-delete:hover {
      background: var(--red);
      color: #0b0f14;
      box-shadow: 0 0 14px var(--red-glow);
      transform: rotate(90deg);
    }

    .badge-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 16px;
    }

    .badge-box {
      background: rgba(12, 17, 24, 0.8);
      border: 1px solid rgba(248, 113, 113, 0.2);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.3s ease;
    }

    .badge-box:hover {
      border-color: rgba(248, 113, 113, 0.5);
      box-shadow: inset 0 0 12px rgba(248, 113, 113, 0.12);
    }

    .badge-box .lbl { font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .badge-box .val { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; color: var(--accent-bright); text-shadow: 0 0 6px var(--accent-glow); }

    .status-msg {
      margin-top: 16px;
      padding: 14px 18px;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      background: rgba(12, 17, 24, 0.85);
      border-left: 4px solid var(--text-muted);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s;
    }

    .status-msg.ok { border-color: var(--green); color: var(--green); box-shadow: inset 0 0 15px rgba(74, 222, 128, 0.05); }
    .status-msg.approx { border-color: var(--orange); color: var(--orange); box-shadow: inset 0 0 15px rgba(251, 146, 60, 0.05); }
    .status-msg.no { border-color: var(--red); color: var(--red); box-shadow: inset 0 0 15px rgba(248, 113, 113, 0.08); }
    .status-msg.searching { border-color: var(--accent); color: var(--accent); }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(248, 113, 113, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .table-wrapper {
      margin-top: 10px;
      background: rgba(12, 17, 24, 0.85);
      border: 1px solid rgba(248, 113, 113, 0.2);
      border-radius: 8px;
      padding: 12px;
    }

    table { width: 100%; border-collapse: collapse; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
    th { color: var(--text-muted); font-size: 10px; text-transform: uppercase; padding: 8px; text-align: right; border-bottom: 1px solid rgba(248, 113, 113, 0.2); }
    th:first-child, td:first-child { text-align: left; }
    td { padding: 8px; text-align: right; border-bottom: 1px solid rgba(255, 255, 255, 0.03); transition: background 0.2s; }
    tr:hover td { background: rgba(248, 113, 113, 0.06); }

    .dropdown-btn {
      width: 100%;
      margin-top: 16px;
      background: rgba(12, 17, 24, 0.9);
      border: 1px solid var(--panel-border);
      color: var(--accent-bright);
      padding: 10px 16px;
      border-radius: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .dropdown-btn:hover {
      border-color: var(--accent);
      background: rgba(248, 113, 113, 0.12);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .dropdown-arrow {
      transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      font-size: 10px;
    }

    .dropdown-btn.active .dropdown-arrow {
      transform: rotate(180deg) scale(1.2);
    }

    .stats-dropdown-content {
      display: grid;
      grid-template-rows: 0fr;
      margin-top: 0;
      opacity: 0;
      background: rgba(12, 17, 24, 0.95);
      border: 1px solid transparent;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      transition: grid-template-rows 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                  opacity 0.3s ease, 
                  margin-top 0.4s ease, 
                  border-color 0.4s ease,
                  padding 0.4s ease;
      overflow: hidden;
      padding: 0 16px;
    }

    .stats-dropdown-inner {
      min-height: 0;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      transform: translateY(-10px);
    }

    .stats-dropdown-content.open {
      grid-template-rows: 1fr;
      opacity: 1;
      margin-top: 10px;
      padding: 16px;
      border-color: rgba(248, 113, 113, 0.3);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4), inset 0 0 15px rgba(248, 113, 113, 0.05);
    }

    .stats-dropdown-content.open .stats-dropdown-inner {
      transform: translateY(0);
    }

    .stats-group { margin-bottom: 12px; }
    .stats-group:last-child { margin-bottom: 0; }

    .stats-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
    }

    .stats-row .label { color: var(--text-muted); }
    .stats-row .value { color: #fff; font-weight: 700; }

    @media (max-width: 650px) {
      .grid-3, .badge-bar { grid-template-columns: 1fr; }
      .header-left { flex-direction: column; align-items: flex-start; gap: 8px; }
    }
  </style>
</head>
<body>

<img id="bg-video" src="https://raw.githubusercontent.com/ballets4/OAC-Fire-Control/main/pan.gif" alt="Background GIF">

<div class="top-header">
  <div class="header-left">
    <h1>OAC FIRE CONTROL</h1>
    <button class="btn-panorama" id="panorama-toggle-btn" onclick="togglePanorama()">
      <span class="pano-icon">🌐</span>
      <span id="pano-btn-text">Panorama: ON</span>
    </button>
  </div>
</div>

<div class="container">

  <!-- Cannon Config -->
  <div class="card">
    <div class="card-title">Cannon Origin & Global Parameters</div>

    <div class="grid-3" style="margin-bottom: 16px;">
      <div class="field"><label>Origin X</label><input type="number" id="originX" value="12" step="any"></div>
      <div class="field"><label>Origin Y</label><input type="number" id="originY" value="89" step="any"></div>
      <div class="field"><label>Origin Z</label><input type="number" id="originZ" value="-7" step="any"></div>
    </div>

    <div class="badge-box" style="margin-bottom: 16px;">
      <span class="lbl">Nether Position (Origin ÷ 8)</span>
      <span class="val" id="nether-origin-display">Nether Pos: 1.5, -0.875</span>
    </div>

    <div class="field">
      <label>Tolerance Limit (Blocks)</label>
      <input type="number" id="tolerance" value="0.1" min="0.001" step="0.005">
    </div>
  </div>

  <!-- Target List Header -->
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <div class="card-title" style="margin:0;">🎯 Targets</div>
    <button class="btn" id="add-target-btn">+ Add Target</button>
  </div>

  <div id="targets-container" style="display: flex; flex-direction: column; gap: 20px;"></div>

</div>

<script>

function togglePanorama() {
  const bgVideo = document.getElementById('bg-video');
  const btn = document.getElementById('panorama-toggle-btn');
  const btnText = document.getElementById('pano-btn-text');

  bgVideo.classList.toggle('hidden');
  btn.classList.toggle('off');

  if (bgVideo.classList.contains('hidden')) {
    btnText.textContent = 'Panorama: OFF';
  } else {
    btnText.textContent = 'Panorama: ON';
  }
}

let targetCounter = 0;

const arrowVectors = [
  { name: '-X', x: -1.5266908972025421, y: 0.5898789421934996,  z: -0.010949039264749473 },
  { name: '+X', x: 1.3391605816807937,  y: 1.2348182634014597,  z: -0.022975617661742748 },
  { name: '+Z', x: -0.3727794126538941, y: 0.8033298954736217,  z: 1.479730823254127 },
  { name: '-Z', x: -0.37217873913398825, y: 0.8020451717596928, z: -1.480094766467103 }
];

const TNT_FIRE_COMPENSATION_X = 0.915539668365994;
const TNT_FIRE_COMPENSATION_Z = 0.8959942014321007;
const TNT_FIRE_COMPENSATION_Y = 0.9;
const tntVectorsBase = [
  { name: '-X', x: -1.7063921155602588, y: -0.12010562964547475, z: -0.014782262789110306 },
  { name: '+X', x: 1.7841395235011128, y: -0.17586533218866637, z: -0.02168745622450966 },
  { name: '+Z', x: -0.017590758321913435, y: -0.1428816252603725, z: 1.745135640926592 },
  { name: '-Z', x: 0.016548649077465027, y: -0.1428827423749702, z: -1.7447004614574904 }
];
const tntVectors = tntVectorsBase.map(v => ({
  name: v.name,
  x: v.x * TNT_FIRE_COMPENSATION_X,
  y: v.y * TNT_FIRE_COMPENSATION_Y,
  z: v.z * TNT_FIRE_COMPENSATION_Z
}));

const fmt = (v, p = 3) => Number(v || 0).toFixed(p);

function updateNetherOrigin() {
  const ox = parseFloat(document.getElementById('originX').value) || 0;
  const oy = parseFloat(document.getElementById('originY').value) || 0;
  const oz = parseFloat(document.getElementById('originZ').value) || 0;

  const portalX = ox + 1;
  const portalY = oy;
  const portalZ = oz + 7;

  const netherX = Math.floor(portalX / 8);
  const netherY = Math.floor(portalY / 8);
  const netherZ = Math.floor(portalZ / 8);

  document.getElementById('nether-origin-display').textContent = 
    `Nether Pos: ${netherX}, ${netherY}, ${netherZ}`;
}

function formatItemCount(counterVal) {
  if (counterVal <= 0) return '0 items';
  const stacks = Math.floor(counterVal / 64);
  const items = counterVal % 64;
  if (stacks === 0) return `${items} items`;
  if (items === 0) return `${stacks} stack${stacks > 1 ? 's' : ''}`;
  return `${stacks}stacks + ${items}items`;
}

function solveMix(vectors, wanted, acceptedError, allowedAxes) {
  let bestAccepted = null;
  let bestFallback = null;

  const consider = counts => {
    if (counts.some(n => n < 0)) return;
    const actual = vectors.reduce((sum, v, i) => ({
      x: sum.x + v.x * counts[i],
      y: sum.y + (v.y || 0) * counts[i],
      z: sum.z + v.z * counts[i]
    }), { x: 0, y: 0, z: 0 });
    const error = Math.hypot(actual.x - wanted.x, actual.z - wanted.z);
    const total = counts.reduce((sum, n) => sum + n, 0);
    const candidate = { counts, actual, error, total };
    if (error <= acceptedError && (!bestAccepted || total < bestAccepted.total || (total === bestAccepted.total && error < bestAccepted.error))) bestAccepted = candidate;
    if (!bestFallback || error < bestFallback.error - 1e-9 || (Math.abs(error - bestFallback.error) < 1e-9 && total < bestFallback.total)) bestFallback = candidate;
  };

  const solvePair = (first, second, goal) => {
    const p = vectors[first], q = vectors[second];
    const det = p.x * q.z - p.z * q.x;
    if (Math.abs(det) < 1e-9) return null;
    return { a: (goal.x * q.z - goal.z * q.x) / det, b: (p.x * goal.z - p.z * goal.x) / det };
  };

  const primaryOffsets = Array.from({ length: 65 }, (_, i) => i - 32);

  for (let left = 0; left < allowedAxes.length; left++) {
    for (let right = left + 1; right < allowedAxes.length; right++) {
      const first = allowedAxes[left], second = allowedAxes[right];
      const pair = solvePair(first, second, wanted);
      if (!pair) continue;
      const a0 = Math.round(pair.a), b0 = Math.round(pair.b);
      for (const da of primaryOffsets) {
        for (const db of primaryOffsets) {
          const counts = [0, 0, 0, 0];
          counts[first] = a0 + da;
          counts[second] = b0 + db;
          consider(counts);
        }
      }
    }
  }

  return bestAccepted || bestFallback || { counts: [0,0,0,0], actual: {x:0, y:0, z:0}, error: Infinity, total: 0 };
}

function axesFor(v) {
  const axes = [];
  if (Math.abs(v.x) > 1e-9) axes.push(v.x > 0 ? 1 : 0);
  if (Math.abs(v.z) > 1e-9) axes.push(v.z > 0 ? 2 : 3);
  return axes.length ? axes : [0, 1, 2, 3];
}

function calculateExtraZBatches(arrowCounts, distX, distZ) {
  // Check that the firing direction is STRICTLY +X AND +Z ONLY
  const isPlusXOnly = (arrowCounts[1] > 0) && (arrowCounts[0] === 0);
  const isPlusZOnly = (arrowCounts[2] > 0) && (arrowCounts[3] === 0);

  if (isPlusXOnly && isPlusZOnly) {
    const diff = distX - distZ;
    const maxDist = Math.max(distX, distZ);

    // 1. Must be at least a 50 block difference
    // 2. Must be at least 10% of the total target scale (diff / maxDist >= 0.10)
    if (diff >= 50 && maxDist > 0 && (diff / maxDist) >= 0.10) {
      // Scales up with the size of the gap between X and Z: every extra 200
      // blocks of difference adds one more batch (e.g. 100 diff -> +1,
      // 500 diff -> +3). Equal distances (diff <= 0) stay at 0.
      return Math.ceil(diff / 100);
    }
  }
  return 0;
}

function evaluateSolution(tx, tz, ox, oy, oz, tolerance) {
  const initialArrowOffset = { x: 1.26, y: 2.48, z: 0.74 };
  const initialTntOffset = { x: 0, y: 0, z: 0 };

  const arrowAim = { x: tx, z: tz };
  const arrowDistance = { x: arrowAim.x - (ox + initialArrowOffset.x), z: arrowAim.z - (oz + initialArrowOffset.z) };
  const arrowAxes = axesFor(arrowDistance);
  const arrow = solveMix(arrowVectors, arrowDistance, tolerance, arrowAxes);

  const arrowCounts = arrow?.counts || [0, 0, 0, 0];
  const extraZBatches = calculateExtraZBatches(arrowCounts, arrowDistance.x, arrowDistance.z);
  const plusZVector = arrowVectors[2];

  const correctedArrowActual = {
    x: (arrow?.actual?.x || 0) + extraZBatches * plusZVector.x,
    y: (arrow?.actual?.y || 0) + extraZBatches * (plusZVector.y || 0),
    z: (arrow?.actual?.z || 0) + extraZBatches * plusZVector.z
  };

  const predicted = {
    x: ox + initialArrowOffset.x + correctedArrowActual.x,
    y: oy + initialArrowOffset.y + correctedArrowActual.y,
    z: oz + initialArrowOffset.z + correctedArrowActual.z
  };
  const neededTntMotion = { x: predicted.x - (ox + initialTntOffset.x), z: predicted.z - (oz + initialTntOffset.z) };
  const stop = solveMix(tntVectors, neededTntMotion, tolerance, arrowAxes);
  const predictedTnt = {
    x: ox + initialTntOffset.x + (stop?.actual?.x || 0),
    y: oy + initialTntOffset.y + (stop?.actual?.y || 0),
    z: oz + initialTntOffset.z + (stop?.actual?.z || 0)
  };

  const centerOffset = { x: predicted.x - predictedTnt.x, z: predicted.z - predictedTnt.z };
  const centerError = Math.hypot(centerOffset.x, centerOffset.z);

  return {
    arrowAim, arrow, predicted, stop, predictedTnt, centerError,
    isWithinTolerance: centerError <= tolerance
  };
}

const PERFECT_ALIGNMENT = 0.0015;
const EXTRA_RINGS_AFTER_HIT = 8;

function findBestAlignedTargetAsync(initialX, initialZ, ox, oy, oz, tolerance, signal, onComplete) {
  let best = null;
  let r = 0;
  let ringsSinceHit = -1;

  const isBetter = (candidate, current) => {
    if (!current) return true;
    if (candidate.centerError < current.centerError - 1e-9) return true;
    if (Math.abs(candidate.centerError - current.centerError) < 1e-9) {
      return candidate.distance < current.distance - 1e-9;
    }
    return false;
  };

  function step() {
    if (signal.aborted) return;

    const startTime = performance.now();

    while (r <= 35) {
      const steps = r === 0 ? 1 : Math.max(12, Math.floor(2 * Math.PI * r * 4));
      for (let i = 0; i < steps; i++) {
        const angle = (2 * Math.PI * i) / steps;
        const testX = r === 0 ? initialX : initialX + r * Math.cos(angle);
        const testZ = r === 0 ? initialZ : initialZ + r * Math.sin(angle);

        const evalRes = evaluateSolution(testX, testZ, ox, oy, oz, tolerance);
        const candidate = {
          ...evalRes,
          targetX: testX,
          targetZ: testZ,
          distance: Math.hypot(testX - initialX, testZ - initialZ)
        };

        if (evalRes.isWithinTolerance && isBetter(candidate, best)) {
          best = candidate;
        }
      }

      if (best && best.centerError <= PERFECT_ALIGNMENT) {
        onComplete(best);
        return;
      }

      if (best) {
        ringsSinceHit = ringsSinceHit < 0 ? 0 : ringsSinceHit + 1;
        if (ringsSinceHit >= EXTRA_RINGS_AFTER_HIT) {
          onComplete(best);
          return;
        }
      }

      r += 0.25;

      if (performance.now() - startTime > 8) {
        setTimeout(step, 0);
        return;
      }
    }

    onComplete(best);
  }

  step();
}

function getAdjustedCounts(vectors, counts, isTnt, distX, distZ) {
  const safeCounts = counts || [0, 0, 0, 0];
  const extraZBatches = isTnt ? 0 : calculateExtraZBatches(safeCounts, distX, distZ);

  return vectors.map((v, i) => {
    let b = safeCounts[i] || 0;
    if (v.name === '+Z') b += extraZBatches;
    return b;
  });
}

function tableHTML(vectors, counts = [0, 0, 0, 0], isTnt = false, distX = 0, distZ = 0) {
  const safeCounts = counts || [0, 0, 0, 0];
  const extraZBatches = isTnt ? 0 : calculateExtraZBatches(safeCounts, distX, distZ);

  const isPlusXActive = (safeCounts[1] || 0) > 0;
  const isMinusXActive = (safeCounts[0] || 0) > 0;
  const isPlusZActive = (safeCounts[2] || 0) > 0;
  const isMinusZActive = (safeCounts[3] || 0) > 0;
  const isPlusXMinusZOnly = !isTnt && isPlusXActive && isMinusZActive && !isMinusXActive && !isPlusZActive;

  const rows = vectors.map((v, i) => {
    let batches = safeCounts[i] || 0;

    // Add extraZBatches to the +Z vector batch count
    if (v.name === '+Z') {
      batches += extraZBatches;
    }

    const totalTnt = batches * 10;
    const sub = isTnt ? 3 : 2;

    // Compute counter and item values off the updated batch total
    let counterVal = batches <= 0 ? 0 : Math.max(0, batches - sub);

    // If the arrow is firing strictly +X and -Z, the +X row loses 1 extra
    // from its counter/items on top of the normal subtraction.
    if (isPlusXMinusZOnly && v.name === '+X') {
      counterVal = Math.max(0, counterVal - 1);
    }

    return `<tr>
      <td>${v.name}</td>
      <td>${batches + (v.name === '+Z' && extraZBatches > 0 ? 1 : 0)}${v.name === '+Z' && extraZBatches > 0 ? ` <span style="color:var(--orange); font-size:10px;">(+${extraZBatches})</span>` : ''}</td>
      <td>${totalTnt}</td>
      <td>${batches === 0 ? '—' : counterVal}</td>
      <td style="color:var(--accent-bright);">${formatItemCount(counterVal + (v.name === '+Z' ? extraZBatches))}</td>
    </tr>`;
  }).join('');

  return `<table>
    <thead><tr><th>Dir</th><th>Batch</th><th>TNT</th><th>Cnt</th><th>Items</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function tableHTMLTNT2(vectors, counts = [0, 0, 0, 0]) {
  const safeCounts = counts || [0, 0, 0, 0];

  const isMinusX = (safeCounts[0] || 0) > 0;
  const isPlusX  = (safeCounts[1] || 0) > 0;
  const isPlusZ  = (safeCounts[2] || 0) > 0;
  const isMinusZ = (safeCounts[3] || 0) > 0;

  const isMinusXPlusZOnly = isMinusX && isPlusZ && !isPlusX && !isMinusZ;

  const rows = vectors.map((v, i) => {
    let batches = safeCounts[i] || 0;
    const totalTnt = batches * 10;

    let counterVal = batches <= 0 ? 0 : Math.max(0, batches - 3);

    if (batches > 0) {
      if (v.name === '-X' || v.name === '-Z' || v.name === '+X' || v.name === '+Z') {
        counterVal += 1;
      }
    }
    if (batches > 0 && v.name === '-X') {
      counterVal += 1;
    }

    if (v.name === '+Z' && isMinusXPlusZOnly) {
      counterVal -= 1;
    }

    counterVal = Math.max(0, counterVal);

    return `<tr>
      <td>${v.name}</td>
      <td>${batches}</td>
      <td>${totalTnt}</td>
      <td>${batches === 0 ? '—' : counterVal}</td>
      <td style="color:var(--accent-bright);">${formatItemCount(counterVal)}</td>
    </tr>`;
  }).join('');

  return `<table>
    <thead><tr><th>Dir</th><th>Batch</th><th>TNT</th><th>Cnt</th><th>Items</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function formatFormattedTime(totalSec) {
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  const mStr = String(m).padStart(2, '0');
  const sStr = s.toFixed(1).padStart(4, '0');
  return `${mStr}:${sStr}`;
}

function toggleDropdown(id) {
  const btn = document.getElementById(`dropdown-btn-${id}`);
  const content = document.getElementById(`dropdown-content-${id}`);
  btn.classList.toggle('active');
  content.classList.toggle('open');
}

function debounce(func, wait) {
  let timeout;
  return function(...args) {
    clearTimeout(timeout);
    timeout = setTimeout(() => func.apply(this, args), wait);
  };
}

function addTargetCard(defaultTx = 100, defaultTy = 89, defaultTz = 100) {
  targetCounter++;
  const id = targetCounter;
  const container = document.getElementById('targets-container');

  const card = document.createElement('div');
  card.className = 'card';
  card.id = `target-card-${id}`;

  card.innerHTML = `
    <div class="card-title">
      <span>Target Coordinates #${id}</span>
      <button class="btn-delete" title="Remove Target" onclick="removeTargetCard(${id})">✕</button>
    </div>

    <div class="grid-3">
      <div class="field"><label>Target X</label><input type="number" class="t-x" value="${defaultTx}" step="any"></div>
      <div class="field"><label>Target Y</label><input type="number" class="t-y" value="${defaultTy}" step="any"></div>
      <div class="field"><label>Target Z</label><input type="number" class="t-z" value="${defaultTz}" step="any"></div>
    </div>

    <div class="badge-bar">
      <div class="badge-box"><span class="lbl">Actual Target</span><span class="val actual-target-xyz">100, 89, 100</span></div>
      <div class="badge-box"><span class="lbl">Center Error</span><span class="val center-error">0.000</span></div>
    </div>

    <div class="status-msg"></div>

    <button class="dropdown-btn" id="dropdown-btn-${id}" onclick="toggleDropdown(${id})">
      <span>Show Target Stats</span>
      <span class="dropdown-arrow">▼</span>
    </button>

    <div class="stats-dropdown-content" id="dropdown-content-${id}">
      <div class="stats-dropdown-inner">
        <div class="stats-group">
          <div class="stats-title">Predicted Landing</div>
          <div class="stats-row"><span class="label">Coordinates:</span><span class="value landing-xyz">0, 0, 0</span></div>
        </div>
        <div class="stats-group" style="margin-top: 12px;">
          <div class="stats-title">Time Estimates</div>
          <div class="stats-row"><span class="label">Payload Building:</span><span class="value">00:01:25</span></div>
          <div class="stats-row"><span class="label">Arrow Acceleration:</span><span class="value arrow-accel-time">00:00.0 (0.0s)</span></div>
          <div class="stats-row"><span class="label">Main TNT Acceleration:</span><span class="value main-tnt-accel-time">00:00.0 (0.0s)</span></div>
          <div class="stats-row"><span class="label">TNT 2 Acceleration:</span><span class="value tnt-2-accel-time">00:00.0 (0.0s)</span></div>
          <div class="stats-row" style="border-top: 1px solid rgba(248,113,113,0.3); margin-top: 4px; padding-top: 4px;">
            <span class="label" style="color:var(--accent-bright);">Total Time:</span>
            <span class="value total-time" style="color:var(--green);">00:00.0</span>
          </div>
        </div>
      </div>
    </div>

    <div class="grid-3" style="margin-top: 16px;">
      <div>
        <div class="card-title" style="font-size:11px; margin-bottom:6px;">Arrow Acceleration</div>
        <div class="table-wrapper arrow-table"></div>
      </div>
      <div>
        <div class="card-title" style="font-size:11px; margin-bottom:6px;">Main Acceleration</div>
        <div class="table-wrapper tnt-table"></div>
      </div>
      <div>
        <div class="card-title" style="font-size:11px; margin-bottom:6px;">TNT 2</div>
        <div class="table-wrapper tnt2-table"></div>
      </div>
    </div>
  `;

  container.appendChild(card);

  const debouncedCompute = debounce(() => computeCard(card), 150);
  card.querySelectorAll('input').forEach(input => input.addEventListener('input', debouncedCompute));

  computeCard(card);
}

function removeTargetCard(id) {
  const card = document.getElementById(`target-card-${id}`);
  if (card) {
    if (card.abortController) card.abortController.abort();
    card.style.animation = 'cardSpawn 0.3s reverse ease-in forwards';
    setTimeout(() => card.remove(), 300);
  }
}

function computeCard(card) {
  if (card.abortController) {
    card.abortController.abort();
  }
  card.abortController = new AbortController();

  const ox = parseFloat(document.getElementById('originX').value) || 0;
  const oy = parseFloat(document.getElementById('originY').value) || 0;
  const oz = parseFloat(document.getElementById('originZ').value) || 0;

  const tolerance = parseFloat(document.getElementById('tolerance').value) || 0.05;

  let reqX = parseFloat(card.querySelector('.t-x').value) || 0;
  let reqY = parseFloat(card.querySelector('.t-y').value) || 0;
  let reqZ = parseFloat(card.querySelector('.t-z').value) || 0;

  let res = evaluateSolution(reqX, reqZ, ox, oy, oz, tolerance);

  const statusEl = card.querySelector('.status-msg');
  statusEl.className = 'status-msg searching';
  statusEl.innerHTML = `<div class="spinner"></div><span>Aligning arrow under main TNT...</span>`;

  findBestAlignedTargetAsync(reqX, reqZ, ox, oy, oz, tolerance, card.abortController.signal, (bestAligned) => {
    if (bestAligned) {
      const moved = Math.hypot(bestAligned.targetX - reqX, bestAligned.targetZ - reqZ) > 1e-9;
      renderResults(card, bestAligned, bestAligned.targetX, bestAligned.targetZ, reqY, ox, oy, oz, tolerance, moved);
    } else {
      renderResults(card, res, reqX, reqZ, reqY, ox, oy, oz, tolerance, false);
    }
  });
}

function renderResults(card, res, actualX, actualZ, reqY, ox, oy, oz, tolerance, targetAdjusted) {
  const verticalSame = Math.abs(reqY - oy) < 1e-9;
  const statusEl = card.querySelector('.status-msg');

  if (res.isWithinTolerance) {
    statusEl.className = verticalSame ? 'status-msg ok' : 'status-msg approx';
    let msg = targetAdjusted 
      ? `OPTIMIZED TRAJECTORY: Shifted target to (X: ${fmt(actualX)}, Z: ${fmt(actualZ)}). `
      : `SOLUTION FOUND: `;
    msg += `Margin error ${fmt(res.centerError, 4)} blocks (Tolerance: ${fmt(tolerance)}).`;
    statusEl.textContent = msg;
  } else {
    statusEl.className = 'status-msg no';
    statusEl.textContent = `OUT OF RANGE: Error ${fmt(res.centerError, 4)} exceeds ${fmt(tolerance)} limit.`;
  }

  card.querySelector('.actual-target-xyz').textContent = `${fmt(actualX)}, ${fmt(reqY, 2)}, ${fmt(actualZ)}`;
  card.querySelector('.landing-xyz').textContent = `${fmt(res.predicted.x)}, ${fmt(res.predicted.y, 2)}, ${fmt(res.predicted.z)}`;
  card.querySelector('.center-error').textContent = `${fmt(res.centerError, 4)} blks`;

  const initialArrowOffsetX = 1.26;
  const initialArrowOffsetZ = 0.74;
  const distX = actualX - (ox + initialArrowOffsetX);
  const distZ = actualZ - (oz + initialArrowOffsetZ);

  card.querySelector('.arrow-table').innerHTML = tableHTML(arrowVectors, res.arrow?.counts, false, distX, distZ);
  card.querySelector('.tnt-table').innerHTML = tableHTML(tntVectors, res.stop?.counts, true, distX, distZ);
  card.querySelector('.tnt2-table').innerHTML = tableHTMLTNT2(tntVectors, res.stop?.counts);

  const arrowAdjCounts = getAdjustedCounts(arrowVectors, res.arrow?.counts, false, distX, distZ);
  const mainTntAdjCounts = getAdjustedCounts(tntVectors, res.stop?.counts, true, distX, distZ);
  const tnt2AdjCounts = getAdjustedCounts(tntVectors, res.stop?.counts, true, distX, distZ);

  const maxAxisBatches = (counts) => Math.max(
    Math.max(counts[0] || 0, counts[1] || 0),
    Math.max(counts[2] || 0, counts[3] || 0)
  );

  const arrowMax = maxAxisBatches(arrowAdjCounts);
  const mainTntMax = maxAxisBatches(mainTntAdjCounts);
  const tnt2Max = maxAxisBatches(tnt2AdjCounts);

  const arrowAccelSeconds = arrowMax * 0.3;
  const mainTntAccelSeconds = mainTntMax * 0.3;
  const tnt2AccelSeconds = tnt2Max * 0.3;

  const payloadSeconds = 85 + 40;
  const totalSeconds = payloadSeconds + arrowAccelSeconds + mainTntAccelSeconds + tnt2AccelSeconds;

  card.querySelector('.arrow-accel-time').textContent = `${formatFormattedTime(arrowAccelSeconds)} (${arrowAccelSeconds.toFixed(1)}s)`;
  card.querySelector('.main-tnt-accel-time').textContent = `${formatFormattedTime(mainTntAccelSeconds)} (${mainTntAccelSeconds.toFixed(1)}s)`;
  card.querySelector('.tnt-2-accel-time').textContent = `${formatFormattedTime(tnt2AccelSeconds)} (${tnt2AccelSeconds.toFixed(1)}s)`;
  card.querySelector('.total-time').textContent = formatFormattedTime(totalSeconds);
}

const updateAllDebounced = debounce(() => {
  updateNetherOrigin();
  document.querySelectorAll('#targets-container .card').forEach(computeCard);
}, 150);

['originX', 'originY', 'originZ', 'tolerance'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateAllDebounced);
});

document.getElementById('add-target-btn').addEventListener('click', () => addTargetCard());

// Initial setup
updateNetherOrigin();
addTargetCard(100, 89, 100);
</script>

</body>
